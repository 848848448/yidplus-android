name: Test the released app on one device shape

# Runs the newest released APK through qa/screens.sh on one emulator you pick.
on:
  workflow_dispatch:
    inputs:
      api: { description: 'Android API level (30 = Android 11)', required: true, default: '30' }
      target: { description: 'default, google_apis or google_apis_playstore', required: true, default: 'google_apis' }
      size: { description: 'Screen size, e.g. 480x640 (empty = device default)', required: false, default: '480x640' }
      density: { description: 'Screen density, e.g. 240', required: false, default: '240' }
      name: { description: 'Name for the evidence branch', required: true, default: 'small-android11-google' }

permissions:
  contents: write

jobs:
  device:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Newest released APK
        run: |
          mkdir -p dist
          curl -fsSL -o dist/YIDPLUS.apk "https://github.com/${{ github.repository }}/releases/latest/download/YIDPLUS.apk"
          curl -fsSL "https://github.com/${{ github.repository }}/releases/latest/download/version.json" | jq -r .versionName
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator test
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ github.event.inputs.api }}
          target: ${{ github.event.inputs.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          # 2.0 and newer are the native app: the full native test (480x640, phone, tablet, D-pad) on the chosen image
          script: bash qa/native.sh dist/YIDPLUS.apk
      - name: Publish screenshots
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -d qa/out || exit 0
          cd qa/out && git init -q && git checkout -q -b qa-${{ github.event.inputs.name }} && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "device test ${{ github.run_id }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" qa-${{ github.event.inputs.name }}
      - name: Result
        run: cat qa/out/RESULT && grep -q '^PASS' qa/out/RESULT
