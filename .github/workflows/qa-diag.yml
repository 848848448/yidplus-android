name: QA diagnostic (IME state, separate from the native workflow)

# Runs the signed-in fixture scripts for a chosen sequence on a fresh emulator, with qa/fx-cl.sh replaced by diag/fx-cl.sh
# (the same script plus IME/focus logging). Triggers only on diag/** and this file, so it never starts or cancels the
# native workflow; it has its own concurrency group and publishes only qa-diag-* log branches.
on:
  push:
    branches: ['feat-*']
    paths: ['diag/**', '.github/workflows/qa-diag.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-diag-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Production source as pushed (no diagnostic patch in this run)
        run: git log -1 --format='building %h %s' && git status --short | head -3
      - name: Signing key (from repository secrets only)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Build signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease -PversionName=2.0.0 --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Check
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          ls -la "$APK"
          mkdir -p dist && cp "$APK" dist/YIDPLUS.apk
          unzip -l "$APK" | grep -E "baseline.prof|classes" || true
      - uses: actions/upload-artifact@v4
        with:
          name: diag-apk
          path: dist/
      - name: Resolved Compose versions (from this build's runtime classpath)
        if: always()
        run: |
          mkdir -p /tmp/log
          gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon -q 2>&1 | grep -E "androidx\.compose\.(ui|foundation|material3|runtime)[a-z-]*:|compose-bom|androidx\.activity:activity-compose|coil" | sed 's/^[ |+\\-]*//' | sort -u > /tmp/log/compose-versions.txt || true
          cat /tmp/log/compose-versions.txt
      - name: Publish build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/log; (grep -E "^e: |error:|FAILED|BUILD|What went wrong" -A3 build.log | head -300 > /tmp/log/errors.txt || true)
          tail -400 build.log > /tmp/log/build-tail.txt 2>/dev/null || true
          ls -la dist/ > /tmp/log/dist.txt 2>/dev/null || true
          cp app/build/outputs/mapping/release/mapping.txt /tmp/log/mapping.txt 2>/dev/null || true
          cd /tmp/log && git init -q && git checkout -q -b ci-log-diag-${{ github.ref_name }} && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "native build log ${{ github.run_id }} ${{ job.status }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-log-diag-${{ github.ref_name }}

  qa:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: default, part: fx33f, wait: '2', mode: 'ctrl', anim: 'off', fix: '1', diag: 'no', fx: 'qa/fx-fp.sh' }
          - { target: default, part: fx34n, wait: '2', mode: 'ctrl', anim: 'off', fix: '1', diag: 'no', fx: 'qa/fx-nw.sh' }
          - { target: default, part: fx32m, wait: '2', mode: 'ctrl', anim: 'off', fix: '1', diag: 'no', fx: 'qa/fx-mu.sh' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: diag-apk
          path: dist/
      - name: Use diag/fx-cl18.sh plus the header and real-bounds tap additions (patched in the workspace only, not committed; asserts each replacement matches once)
        if: matrix.diag == 'yes'
        run: |
          python3 - <<'PY'
          s = open('diag/fx-cl18.sh').read()
          a = "clfieldon() { [ -n \"$(clpos 'Paste the invite link')\" ]; }\n"
          assert s.count(a) == 1
          s = s.replace(a, a + "clhdr() { [ -n \"$(clpos 'Join by invite link')\" ] && echo header-present || echo header-ABSENT; }\n" + "cleditpos() { timeout 30 adb shell uiautomator dump /sdcard/cle.xml >/dev/null 2>&1; timeout 20 adb shell cat /sdcard/cle.xml 2>/dev/null | tr '>' '\\n' | grep 'class=\"android.widget.EditText\"' | head -1 | grep -oE 'bounds=\"\\[[0-9]+,[0-9]+\\]\\[[0-9]+,[0-9]+\\]\"' | grep -oE '[0-9]+' | tr '\\n' ' ' | awk '{print int(($1+$3)/2), int(($2+$4)/2)}'; }\n")
          x = 'log "CL S2 landscape: field present | kb $(clshown_now)"'
          assert s.count(x) == 1
          s = s.replace(x, x[:-1] + ' | $(clhdr)"')
          old = 'if clfieldon; then log "CL S2 portrait again: field present | kb $(clshown_now)"; else log "CL S2 portrait again: field absent, see CL-S2-portrait-again"; fi; shot CL-S2-portrait-again;'
          assert s.count(old) == 1
          new = ' if clfieldon; then log "CL S2 portrait header: $(clhdr)"; if clshown_now | grep -q true; then key 4; sleep 1.5; fi; EP=$(cleditpos); log "CL S2 REAL tap target (EditText node centre): ${EP:-none} | kb before $(clshown_now)"; if [ -n "$EP" ]; then set -- $EP; adb shell input tap $1 $2; sleep 2; log "CL S2 REAL reopen by tap: $(clshown_now) | $(clhdr)"; shot CL-S2-real-reopen; else log "CL S2 REAL reopen INVALID: EditText not found"; fi; fi;'
          s = s.replace(old, old + new)
          helper = "hdrb() { timeout 30 adb shell uiautomator dump /sdcard/hb.xml >/dev/null 2>&1; local x; x=$(timeout 20 adb shell cat /sdcard/hb.xml 2>/dev/null | tr '>' '\\n'); log \"HDRB $1: title=$(echo \"$x\" | grep -E 'text=\\\"Join by invite link\\\"' | grep -oE 'bounds=\\\"[^\\\"]*\\\"' | head -1) field=$(echo \"$x\" | grep 'class=\\\"android.widget.EditText\\\"' | grep -oE 'bounds=\\\"[^\\\"]*\\\"' | head -1) kb=$(clshown_now)\"; }\n"
          hook = 'clfieldon() {'
          assert s.count(hook) == 1
          s = s.replace(hook, helper + hook)
          for tag, name in (('shot CL-S2-second-open', 'second-open'), ('shot CL-S2-after-home', 'after-home'), ('shot CL-S2-landscape', 'landscape'), ('shot CL-S2-portrait-again', 'portrait-again')):
              assert s.count(tag) >= 1, tag
              s = s.replace(tag, tag + '; hdrb ' + name)
          open('qa/fx-cl.sh', 'w').write(s)
          PY
          bash -n qa/fx-cl.sh && echo patched-syntax-ok && grep -c "REAL reopen" qa/fx-cl.sh
      - name: Pre-script for the nav-mode variant (only runs when listed in fx; enables the gestural nav overlay exactly as qa/fx-cl.sh:70 does)
        run: |
          printf '%s\n' 'timeout 20 adb shell cmd overlay enable com.android.internal.systemui.navbar.gestural >/dev/null 2>&1; sleep 3; log "NAV pre-script: navigation_mode=$(timeout 10 adb shell settings get secure navigation_mode 2>&1)"' > qa/fx-nav.sh
          cat qa/fx-nav.sh
      - name: Truncated copies of qa/fx-cl.sh (cut at a top-level line, must pass bash -n) and the state-logging pre-script (workspace only, not committed)
        run: |
          for N in 86 165; do head -n $N qa/fx-cl.sh > qa/fx-cl$N.sh; bash -n qa/fx-cl$N.sh && echo "fx-cl$N.sh syntax ok ($(wc -l < qa/fx-cl$N.sh) lines)"; done
          cat > qa/fx-state.sh <<'ST'
          log "STATE uimode night: $(timeout 10 adb shell cmd uimode night 2>&1 | tr '\n' ' ')"
          log "STATE wm: $(timeout 10 adb shell wm size | tr '\n' ' ') $(timeout 10 adb shell wm density | tr '\n' ' ')"
          log "STATE overlays enabled: $(timeout 20 adb shell cmd overlay list 2>/dev/null | grep -E '^\[x\]' | tr '\n' ' ')"
          log "STATE window touch mode: $(timeout 20 adb shell dumpsys window 2>/dev/null | grep -o 'mInTouchMode=[a-z]*' | head -2 | tr '\n' ' ')"
          log "STATE nav mode: $(timeout 10 adb shell settings get secure navigation_mode 2>&1) | show_ime_with_hard_keyboard: $(timeout 10 adb shell settings get secure show_ime_with_hard_keyboard 2>&1) | accelerometer_rotation: $(timeout 10 adb shell settings get system accelerometer_rotation 2>&1) user_rotation: $(timeout 10 adb shell settings get system user_rotation 2>&1) font_scale: $(timeout 10 adb shell settings get system font_scale 2>&1)"
          for t in system secure global; do timeout 30 adb shell settings list $t > "$OUT/state-$t-$(date +%H%M%S).txt" 2>&1; done
          log "STATE config: $(timeout 30 adb shell dumpsys activity activities 2>/dev/null | grep -m2 -E 'mFullConfiguration|mMergedOverrideConfiguration' | cut -c1-400 | tr '\n' ' ')"
          ST
          cat > qa/fx-keypre.sh <<'KP'
          timeout 10 adb shell input keyevent 20; sleep 1.5
          log "KEYPRE: one SHIFT key event sent (no navigation); $(timeout 20 adb shell dumpsys window 2>/dev/null | grep -o 'mInTouchMode=[a-z]*' | head -2 | tr '\n' ' ')"
          KP
          bash -n qa/fx-keypre.sh && echo "fx-keypre.sh syntax ok"
          bash -n qa/fx-state.sh && echo "fx-state.sh syntax ok"
      - name: First-key behaviour scripts (touch entry vs key entry; workspace only, not committed)
        run: |
          cat > /tmp/tf.tpl <<'TPL'
          TF_FIRST=@FIRST@; TF_TOUCH=@TOUCH@
          tfmode() { timeout 20 adb shell dumpsys window 2>/dev/null | grep -o 'mInTouchMode=[a-z]*' | head -1; }
          tf_focus() { timeout 30 adb shell uiautomator dump /sdcard/tf.xml >/dev/null 2>&1; timeout 20 adb shell cat /sdcard/tf.xml 2>/dev/null | tr '>' '\n' | grep 'focused="true"' | grep -v 'class="android.widget.FrameLayout"' | sed -n 's/.*class="\([^"]*\)".*content-desc="\([^"]*\)".*bounds="\(\[[0-9,]*\]\[[0-9,]*\]\)".*/\1|\2|\3/p' | head -3 | tr '\n' ' '; }
          tf_sheet() { timeout 20 adb shell cat /sdcard/tf.xml 2>/dev/null | tr '>' '\n' | grep -cE 'text="(Forward|Copy|Reply)"|content-desc="(Forward|Copy|Reply)"'; }
          if [ "$TF_TOUCH" = 1 ]; then adb shell input tap 240 8; else adb shell input keyevent 20; fi; sleep 1.5
          restart 5
          log "TF entry ($TF_TOUCH=touch): $(tfmode)"
          timeout 40 adb shell "am start -n $PKG/.MainActivity -a com.yidplus.app.OPEN_CHAT --es room '{\"id\":\"r-cs\",\"type\":\"group\",\"nick\":\"CS QA\",\"unread\":5,\"members\":3}'" >/dev/null 2>&1; sleep 7
          log "TF opened: $(tfmode) | focus: $(tf_focus)"; shot TF-0-opened
          key $TF_FIRST; sleep 1.5; log "TF after first press ($TF_FIRST): $(tfmode) | focus: $(tf_focus)"; shot TF-1-first
          key 20; sleep 1; log "TF after DOWN: focus: $(tf_focus)"; shot TF-2-down
          key 20; sleep 1; log "TF after DOWN 2: focus: $(tf_focus)"
          key 23; sleep 2; F3=$(tf_focus); log "TF after OK: focus: $F3 | action-sheet words on screen: $(tf_sheet)"; shot TF-3-ok
          key 4; sleep 1; log "TF after Back: focus: $(tf_focus)"
          TPL
          for v in "down 20 1" "center 23 1" "left 21 1" "ctrl 20 0"; do set -- $v; sed -e "s/@FIRST@/$2/" -e "s/@TOUCH@/$3/" /tmp/tf.tpl > qa/fx-tf$1.sh; bash -n qa/fx-tf$1.sh && echo "fx-tf$1.sh syntax ok"; done
      - name: Entry-path script (key entry, touch entry, launcher/chat-list tap entry, per-key mic reach, voice-reopen list dumps; workspace only, not committed)
        run: |
          cat > qa/fx-entry2.sh <<'ENT'
          tfmode() { timeout 20 adb shell dumpsys window 2>/dev/null | grep -o 'mInTouchMode=[a-z]*' | head -1; }
          imeup() { timeout 10 adb shell dumpsys input_method 2>/dev/null | grep -o 'mInputShown=[a-z]*' | head -1; }
          en_dump() { timeout 30 adb shell uiautomator dump /sdcard/en.xml >/dev/null 2>&1; timeout 20 adb shell cat /sdcard/en.xml > "$OUT/$1.xml" 2>/dev/null; }
          en_focus() { tr '>' '\n' < "$OUT/$1.xml" | grep 'focused="true"' | grep -v 'class="android.widget.FrameLayout"' | sed -n 's/.*class="\([^"]*\)".*content-desc="\([^"]*\)".*bounds="\(\[[0-9,]*\]\[[0-9,]*\]\)".*/\1|\2|\3/p' | head -2 | tr '\n' ' '; }
          en_has() { tr '>' '\n' < "$OUT/$1.xml" | grep -cF -- "$2"; }
          en_open() { timeout 40 adb shell "am start -n $PKG/.MainActivity -a com.yidplus.app.OPEN_CHAT --es room '{\"id\":\"r-cs\",\"type\":\"group\",\"nick\":\"CS QA\",\"unread\":5,\"members\":3}'" >/dev/null 2>&1; sleep 7; }
          log "STATE show_ime_with_hard_keyboard=$(timeout 10 adb shell settings get secure show_ime_with_hard_keyboard 2>&1) | $(tfmode)"
          cstep() { # $1 prefix $2 key $3 label: press, dump, log focus + IME state, shot
            key $2; sleep 1; en_dump "$1"; log "E4B $3: focus [$(en_focus "$1")] | $(imeup)"; shot "$1"
          }
          escape_ok() { case "$1" in *Attach*|*Emoji*|*Camera*|*"Record voice message"*) return 0 ;; esac; return 1; }
          edit_centre() { tr '>' '\n' < "$OUT/$1.xml" | grep 'class="android.widget.EditText"' | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p' | head -1; }
          # V1: focus the empty composer field by TOUCH and leave the keyboard UP; RIGHT x3 (the preserved isolated pass hides the keyboard first)
          timeout 10 adb shell input keyevent 20; sleep 1; restart 5; en_open
          en_dump V1-start; P=$(edit_centre V1-start)
          if [ -z "$P" ]; then log "E4B MISSING: V1 composer EditText not found in the dump"; else set -- $P; adb shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 )); sleep 2; en_dump V1-tapped; log "E4B V1 after tap: focus [$(en_focus V1-tapped)] | $(imeup)"; shot V1-tapped
            R=""; for i in 1 2 3; do cstep V1-r$i 22 "V1 RIGHT $i (IME up, touch focus)"; R="$R [$(en_focus V1-r$i)]"; escape_ok "$R" && break; done
            if escape_ok "$R"; then log "E4B ok: V1 RIGHT with the IME up reached a composer control: $R"; else log "E4B WRONG: V1 RIGHT with the IME up did not reach a composer control: $R"; FAIL=1; fi
          fi
          # V2: key entry, DOWN until the field holds focus, press BACK to hide the IME (focus kept), then RIGHT x3
          timeout 10 adb shell input keyevent 20; sleep 1; restart 5; en_open
          OK=0; for i in 1 2 3 4 5 6 7 8; do cstep V2-d$i 20 "V2 DOWN $i"; case "$(en_focus V2-d$i)" in *EditText*) OK=1; break ;; esac; done
          if [ $OK = 0 ]; then log "E4B MISSING: V2 the composer field never took focus by DOWN"; else
            log "E4B V2 field focused after $i DOWN | $(imeup)"; key 4; sleep 1.5; en_dump V2-hidden; log "E4B V2 after BACK: focus [$(en_focus V2-hidden)] | $(imeup)"; shot V2-hidden
            case "$(en_focus V2-hidden)" in *EditText*) ;; *) log "E4B INFO: V2 the field does not hold focus after BACK (focus [$(en_focus V2-hidden)]); RIGHT from there is ordinary focus search, not the composer escape" ;; esac
            R=""; for j in 1 2 3; do cstep V2-r$j 22 "V2 RIGHT $j (IME hidden, key focus)"; R="$R [$(en_focus V2-r$j)]"; escape_ok "$R" && break; done
            if escape_ok "$R"; then log "E4B ok: V2 RIGHT with the IME hidden reached a composer control: $R"; elif ! case "$(en_focus V2-hidden)" in *EditText*) true ;; *) false ;; esac; then log "E4B N/A: V2 field not focused after BACK, not judged"; else log "E4B WRONG: V2 RIGHT with the IME hidden did not reach a composer control: $R"; FAIL=1; fi
          fi
          # V3: as E4 (key focus, IME stays up), RIGHT x3 with a shot after each key
          timeout 10 adb shell input keyevent 20; sleep 1; restart 5; en_open
          OK=0; for i in 1 2 3 4 5 6 7 8; do cstep V3-d$i 20 "V3 DOWN $i"; case "$(en_focus V3-d$i)" in *EditText*) OK=1; break ;; esac; done
          if [ $OK = 0 ]; then log "E4B MISSING: V3 the composer field never took focus by DOWN"; else
            R=""; for j in 1 2 3; do cstep V3-r$j 22 "V3 RIGHT $j (IME up, key focus)"; R="$R [$(en_focus V3-r$j)]"; escape_ok "$R" && break; done
            if escape_ok "$R"; then log "E4B ok: V3 RIGHT with the IME up reached a composer control: $R"; else log "E4B WRONG: V3 RIGHT with the IME up did not reach a composer control: $R"; FAIL=1; fi
          fi
          # V4: key entry with the IME up, RIGHT then LEFT in quick succession (a stale retry must not take focus back), then wait and read
          timeout 10 adb shell input keyevent 20; sleep 1; restart 5; en_open
          OK=0; for i in 1 2 3 4 5 6 7 8; do cstep V4-d$i 20 "V4 DOWN $i"; case "$(en_focus V4-d$i)" in *EditText*) OK=1; break ;; esac; done
          if [ $OK = 0 ]; then log "E4B MISSING: V4 the composer field never took focus by DOWN"; else
            adb shell "input keyevent 22; input keyevent 21"; sleep 2; en_dump V4-final; log "E4B V4 RIGHT+LEFT then 2 s: focus [$(en_focus V4-final)] | $(imeup)"; shot V4-final
            case "$(en_focus V4-final)" in *EditText*) log "E4B ok: V4 LEFT after RIGHT returned to the field and the retry did not take focus back" ;; *) log "E4B WRONG: V4 final focus is not the field: [$(en_focus V4-final)]"; FAIL=1 ;; esac
            adb shell "input keyevent 22; input keyevent 20"; sleep 2; en_dump V4b; log "E4B V4b RIGHT+DOWN then 2 s: focus [$(en_focus V4b)]"; shot V4b
          fi
          # V5: RIGHT (retry pending), then a TOUCH on the field within the retry window: the retry must not take focus away from the touched field
          timeout 10 adb shell input keyevent 20; sleep 1; restart 5; en_open
          OK=0; for i in 1 2 3 4 5 6 7 8; do cstep V5-d$i 20 "V5 DOWN $i"; case "$(en_focus V5-d$i)" in *EditText*) OK=1; break ;; esac; done
          if [ $OK = 0 ]; then log "E4B MISSING: V5 the composer field never took focus by DOWN"; else
            P5=$(edit_centre V5-d$i); set -- $P5; TX=$(( ($1 + $3) / 2 )); TY=$(( ($2 + $4) / 2 ))
            adb shell "input keyevent 22; sleep 0.3; input tap 170 524"; sleep 2; en_dump V5-final; log "E4B V5 RIGHT then touch on the field then 2 s: focus [$(en_focus V5-final)] | $(imeup)"; shot V5-final
            case "$(en_focus V5-final)" in *EditText*) log "E4B ok: V5 the field the user touched kept focus" ;; *) log "E4B WRONG: V5 after touching the field, focus is [$(en_focus V5-final)]"; FAIL=1 ;; esac
          fi
          # V5a: same entry, RIGHT only, then dump+shot: what does RIGHT do to the IME and layout (explains V5)
          timeout 10 adb shell input keyevent 20; sleep 1; restart 5; en_open
          OK=0; for i in 1 2 3 4 5 6 7 8; do cstep V5a-d$i 20 "V5a DOWN $i"; case "$(en_focus V5a-d$i)" in *EditText*) OK=1; break ;; esac; done
          if [ $OK = 0 ]; then log "E4B MISSING: V5a field never took focus"; else adb shell input keyevent 22; sleep 1; en_dump V5a-right; log "E4B V5a RIGHT only +1 s: focus [$(en_focus V5a-right)] | $(imeup)"; shot V5a-right; fi
          # V7: D-pad entry (same as V3), RIGHT, then rapid shots (0.3 s apart) and two dumps 3 s apart: is Attach reached promptly and does it stay
          timeout 10 adb shell input keyevent 20; sleep 1; restart 5; en_open
          OK=0; for i in 1 2 3 4 5 6 7 8; do cstep V7-d$i 20 "V7 DOWN $i"; case "$(en_focus V7-d$i)" in *EditText*) OK=1; break ;; esac; done
          if [ $OK = 0 ]; then log "E4B MISSING: V7 field never took focus"; else
            adb shell input keyevent 22; for k in 1 2 3 4 5 6; do shot V7-q$k; sleep 0.3; done
            en_dump V7-a; log "E4B V7 RIGHT +~3 s: focus [$(en_focus V7-a)] | $(imeup)"; sleep 3; en_dump V7-b; log "E4B V7 RIGHT +~7 s: focus [$(en_focus V7-b)] | $(imeup)"
            case "$(en_focus V7-a)$(en_focus V7-b)" in *Attach*Attach*) log "E4B ok: V7 D-pad RIGHT reached Attach and stayed" ;; *) log "E4B WRONG: V7 D-pad RIGHT did not settle on Attach: [$(en_focus V7-a)] [$(en_focus V7-b)]" ;; esac
          fi
          # V6: RIGHT, then BACK within the retry window: read the focus after 2 s (a retry that fires after Back is a defect only if it takes focus on a hidden-IME screen)
          timeout 10 adb shell input keyevent 20; sleep 1; restart 5; en_open
          OK=0; for i in 1 2 3 4 5 6 7 8; do cstep V6-d$i 20 "V6 DOWN $i"; case "$(en_focus V6-d$i)" in *EditText*) OK=1; break ;; esac; done
          if [ $OK = 0 ]; then log "E4B MISSING: V6 the composer field never took focus by DOWN"; else
            adb shell "input keyevent 22; input keyevent 4"; sleep 2; en_dump V6-final; log "E4B V6 RIGHT then BACK then 2 s: focus [$(en_focus V6-final)] | $(imeup)"; shot V6-final
          fi
          # E3b: launcher start, tap an EXISTING list row (Yossi Klein), keys, Back, row focus restored
          restart 5
          timeout 30 adb shell monkey -p $PKG -c android.intent.category.LAUNCHER 1 >/dev/null 2>&1; sleep 8
          en_dump E3b-list; shot E3b-list
          ROW=$(tr '>' '\n' < "$OUT/E3b-list.xml" | grep -F 'text="Yossi Klein"' | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p' | head -1)
          if [ -z "$ROW" ]; then log "ENTRY MISSING: E3b the list row 'Yossi Klein' is not on screen after a launcher start; not a pass"
          else set -- $ROW; RX=$(( ($1 + $3) / 2 )); RY=$(( ($2 + $4) / 2 )); adb shell input tap $RX $RY; sleep 4; en_dump E3b-chat; shot E3b-chat
            if [ "$(en_has E3b-chat 'text="Message"')" -ge 1 ]; then log "ENTRY ok: E3b tapping the list row (at $RX $RY) opened a chat with the composer | $(tfmode) | focus [$(en_focus E3b-chat)]"; else log "ENTRY WRONG: E3b tapped the row at $RX $RY but no composer is on screen"; FAIL=1; fi
            key 20; sleep 1.5; en_dump E3b-key; log "ENTRY E3b after the first DOWN in the chat: focus [$(en_focus E3b-key)] | $(tfmode)"; shot E3b-key
            key 4; sleep 2; en_dump E3b-back; shot E3b-back
            if [ "$(en_has E3b-back 'text="Yossi Klein"')" -ge 1 ]; then log "ENTRY ok: E3b Back returned to the chat list; focus after Back: [$(en_focus E3b-back)] (row Yossi Klein was at y $2-$4)"; else log "ENTRY WRONG: E3b Back did not return to the chat list"; FAIL=1; fi
          fi
          # J: landscape Join by invite link with the keyboard up (480x640 emulator rotated), then portrait again. Shots J-*.
          restart 5; timeout 40 adb shell am start -a android.intent.action.VIEW -d "https://yidplus.com/chat?join=clpriv" $PKG >/dev/null 2>&1; sleep 6; en_dump J-port; shot J-port; log "J portrait: join title on screen: $(en_has J-port 'Join by invite link')"
          adb shell settings put system accelerometer_rotation 0; adb shell settings put system user_rotation 1; sleep 3; en_dump J-land; shot J-land; log "J landscape (no keyboard): join title $(en_has J-land 'Join by invite link'), field $(en_has J-land 'Paste the invite link') | $(imeup)"
          JP=$(tr '>' '\n' < "$OUT/J-land.xml" | grep 'class="android.widget.EditText"' | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p' | head -1)
          if [ -n "$JP" ]; then set -- $JP; adb shell input tap $(( ($1 + $3) / 2 )) $(( ($2 + $4) / 2 )); sleep 3; en_dump J-land-kb; shot J-land-kb; log "J landscape keyboard up: $(imeup) | field nodes $(en_has J-land-kb 'class="android.widget.EditText"') | field bounds $(tr '>' '\n' < "$OUT/J-land-kb.xml" | grep 'class="android.widget.EditText"' | sed -n 's/.*bounds="\(\[[0-9,]*\]\[[0-9,]*\]\)".*/\1/p' | head -1)"; else log "J MISSING: no EditText on the landscape join page"; fi
          adb shell settings put system user_rotation 0; sleep 2
          ENT
          head -n 27 qa/fx-ch.sh > qa/fx-sr.sh
          cat >> qa/fx-sr.sh <<'SRE'
          restart 5; view "https://yidplus.com/chat"; sleep 4
          chtap "Search chats"; sleep 1; adb shell input text "Yo"; sleep 2; shot SR-01-typed
          key 4; sleep 2; shot SR-02-results-keyboard-hidden; chkb "after first Back"
          chtap "Yossi Klein"; sleep 3; shot SR-03-result-opened
          key 4; sleep 2; shot SR-04-back-from-result
          key 4; sleep 2; shot SR-05-back-again
          SRE
          sed -n '1,/^# V1:/p' qa/fx-entry2.sh | sed '$d' > qa/fx-v4.sh
          cat >> qa/fx-v4.sh <<'V4E'
          # V4 repeat: composer field focused by DOWN (IME up), then RIGHT and LEFT. a = back-to-back in one adb call (as fx-entry2), b = 0.8 s apart.
          for MODE in a a a b b b; do
            timeout 10 adb shell input keyevent 20; sleep 1; restart 5; en_open
            OK=0; for i in 1 2 3 4 5 6 7 8; do key 20; sleep 1; en_dump R-d; case "$(en_focus R-d)" in *EditText*) OK=1; break ;; esac; done
            if [ $OK = 0 ]; then log "E4R MISSING: $MODE field never focused"; continue; fi
            if [ $MODE = a ]; then adb shell "input keyevent 22; input keyevent 21"; else adb shell input keyevent 22; sleep 0.8; adb shell input keyevent 21; fi
            sleep 2; en_dump R-f; log "E4R mode $MODE: after RIGHT,LEFT +2 s focus [$(en_focus R-f)] | $(imeup)"; shot R-$MODE-$(date +%S)
          done
          V4E
          bash -n qa/fx-v4.sh && echo fx-v4.sh syntax ok
          bash -n qa/fx-sr.sh && echo fx-sr.sh syntax ok
          head -n 27 qa/fx-ch.sh > qa/fx-mu.sh
          cat >> qa/fx-mu.sh <<'MUE'
          # Music tab with the QA switch (the site has Music off; the switch is QA-only and changes nothing on the site)
          restart 5; view "https://yidplus.com/music"; sleep 4; shot MU-01-site-music-off; log "MU music off on the site: tabs/texts $(timeout 20 adb shell uiautomator dump /sdcard/mu.xml >/dev/null 2>&1; timeout 20 adb shell cat /sdcard/mu.xml 2>/dev/null | grep -oE 'content-desc="(Chats|Shorts|Channels|Music|Settings)"' | tr '\n' ' ')"
          timeout 20 adb shell am start -n $PKG/.MainActivity -a com.yidplus.app.QA_FEATURES --ez all true >/dev/null 2>&1; sleep 2
          view "https://yidplus.com/music"; sleep 6; shot MU-02-music-tab; log "MU music tab texts: $(timeout 20 adb shell uiautomator dump /sdcard/mu.xml >/dev/null 2>&1; timeout 20 adb shell cat /sdcard/mu.xml 2>/dev/null | grep -oE ' text="[^"]+"' | head -14 | tr '\n' ' ')"
          for w in "4 songs" "Niggun for Shabbos" "Hora"; do timeout 20 adb shell cat /sdcard/mu.xml 2>/dev/null | grep -qF "$w" && log "MU ok: '$w' on screen" || log "MU MISSING: '$w' not on screen"; done
          timeout 20 adb logcat -c; key 20; sleep 1; shot MU-03-down; key 23; sleep 2; log "MU playback sample 1: $(timeout 20 adb logcat -d -s YidMusic 2>/dev/null | tail -1 | cut -c1-200)"; sleep 3; log "MU playback sample 2: $(timeout 20 adb logcat -d -s YidMusic 2>/dev/null | tail -1 | cut -c1-200)"; timeout 20 adb logcat -d -s YidMusic 2>/dev/null | grep -c "playing=true" | sed "s/^/MU playing=true events: /" >> "$OUT/qa.log"; shot MU-04-ok-play; log "MU after OK texts: $(timeout 20 adb shell uiautomator dump /sdcard/mu.xml >/dev/null 2>&1; timeout 20 adb shell cat /sdcard/mu.xml 2>/dev/null | grep -oE ' text=\"[^\"]+\"' | head -14 | tr '\n' ' ')"
          timeout 30 adb shell am start -n $PKG/.MainActivity -a com.yidplus.app.OPEN_PLAYER >/dev/null; sleep 3; shot MU-05-player; log "MU player texts: $(timeout 20 adb shell uiautomator dump /sdcard/mu.xml >/dev/null 2>&1; timeout 20 adb shell cat /sdcard/mu.xml 2>/dev/null | grep -oE ' text=\"[^\"]+\"' | head -14 | tr '\n' ' ')"
          key 4; sleep 2; shot MU-06-back
          MUE
          bash -n qa/fx-mu.sh && echo fx-mu.sh syntax ok
          cat > qa/fx-fp.sh <<'FPE'
          vd() { timeout 30 adb shell uiautomator dump /sdcard/vc.xml >/dev/null 2>&1; timeout 20 adb shell cat /sdcard/vc.xml 2>/dev/null | tr '>' '\n' > "$OUT/vc-$1.txt"; }
          vpos() { grep -E "(text|content-desc)=\"$2\"" "$OUT/vc-$1.txt" | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p' | tail -1 | awk '{print int(($1+$3)/2), int(($2+$4)/2)}'; }
          vtap() { vd t; P=$(vpos t "$1"); if [ -z "$P" ]; then log "FP MISSING: '$1' not on screen"; return 1; fi; set -- $P; adb shell input tap $1 $2; sleep 2; log "FP tapped '$1' at $1 $2"; }
          vhas() { grep -qF "$2" "$OUT/vc-$1.txt"; }
          vtexts() { grep -oE ' text="[^"]+"' "$OUT/vc-$1.txt" | head -40 | tr '\n' ' '; }
          restart 5; sleep 4
          vtap "Shorts"; sleep 4; vtap "Following"; sleep 2; vd a; shot FP-01-following-empty; log "FP following texts: $(vtexts a)"
          vhas a "Find people to follow" && log "FP ok: empty Following offers 'Find people to follow'" || log "FP MISSING: no 'Find people to follow' button on the empty Following tab"
          if vtap "Find people to follow"; then sleep 3; vd b; shot FP-02-people-list; log "FP list texts: $(vtexts b)"
            for w in "Follow people" "8 people" "Expert News Status" "Ales UK"; do vhas b "$w" && log "FP ok: '$w' on screen" || log "FP MISSING: '$w' not on screen"; done
            grep -qF 'content-desc="Search people"' "$OUT/vc-b.txt" && log "FP ok: Search icon in the title bar" || log "FP MISSING: Search icon"
            # search with the keyboard UP: a result row must stay visible above it
            vtap "Search people" && { sleep 1; adb shell input text "Ales"; sleep 2; vd d; shot FP-04a-search-keyboard-up; log "FP keyboard shown: $(timeout 10 adb shell dumpsys input_method 2>/dev/null | grep -o 'mInputShown=[a-z]*' | head -1)"; log "FP search texts (keyboard up): $(vtexts d)"
              vhas d "Ales UK" && log "FP ok: 'Ales UK' result visible above the keyboard" || log "FP MISSING: result not visible with the keyboard up"
              vhas d "Expert News Status" && log "FP WRONG: search still lists a non-matching person" || log "FP ok: non-matching people are filtered out"
              key 4; sleep 2; vd d2; shot FP-04b-keyboard-dismissed; log "FP after keyboard Back: $(vtexts d2)"; vhas d2 "Ales UK" && vhas d2 "Follow people" || log "FP note: see FP-04b" ; }
            # leave search (Back from the field bar closes it or leaves the page; log which)
            vtap "Close search" || true; sleep 1
            vd e0; vtap "Follow" ; sleep 1
            vd c; shot FP-03-followed; vhas c "Following ✓" && log "FP ok: a row shows 'Following ✓' after tapping Follow" || log "FP MISSING: no 'Following ✓'"; log "FP followed texts: $(vtexts c)"
            key 4; sleep 2
          fi
          timeout 20 adb logcat -c; vtap "Following"; sleep 5; vd f; shot FP-06-following-after; log "FP YidFollow log: $(timeout 20 adb logcat -d -s YidFollow 2>/dev/null | cut -c30-200 | tr '\n' '|')"; log "FP following-after texts: $(vtexts f)"
          if grep -qE "Sample video|Expert News Status|Ales UK|Abisel" "$OUT/vc-f.txt"; then log "FP ok: Following shows a video of the person followed"; else log "FP MISSING: Following shows no video of the followed person"; fi
          grep -qF 'content-desc="Follow more people"' "$OUT/vc-f.txt" && log "FP ok: 'Follow more people' button is in the Shorts top row" || log "FP MISSING: 'Follow more people' button not in the top row"
          if vtap "Follow more people"; then sleep 3; vd g; shot FP-07-more; vhas g "Follow people" && log "FP ok: 'Follow more people' opens the list while following someone" || log "FP MISSING: list did not open"; vhas g "Following ✓" && log "FP ok: the followed person shows Following ✓" || log "FP MISSING: followed person not marked"
            vtap "Following ✓" && { sleep 1; vd h; shot FP-08-unfollowed; vhas h "Following ✓" && log "FP WRONG: still Following ✓ after unfollow" || log "FP ok: unfollow turned the row back to Follow"; }
            key 4; sleep 4; vd i; shot FP-09-following-after-unfollow; if vhas i "Find people to follow"; then log "FP ok: after unfollow the Following tab is empty again"; else log "FP WRONG: Following still shows videos after unfollowing: $(vtexts i)"; fi
          fi
          # two followed people: both creators' videos show in Following, newest first, each video once
          vtap "Following"; sleep 2; vtap "Follow more people" && { sleep 3; vd m1; vtap "Follow"; sleep 1; vd m2; vtap "Follow"; sleep 1; vd m3; log "FP multi list texts: $(vtexts m3)"; key 4; sleep 5
            CAPS=""; for n in 1 2 3 4 5 6 7 8; do vd mm; CAPS="$CAPS|$(grep -oE 'text="Sample video [0-9]+ from [^"]+"' "$OUT/vc-mm.txt" | head -1)"; [ $n = 1 ] && shot FP-10-following-two; key 20; sleep 2; done
            log "FP multi captions in order: $CAPS"
            echo "$CAPS" | grep -q "Expert News Status" && echo "$CAPS" | grep -q "Abisel Status" && log "FP ok: Following shows videos from both followed people" || log "FP MISSING: Following lacks one of the two followed people"
            D=$(echo "$CAPS" | tr '|' '\n' | grep -v '^$' | sort | uniq -d | head -1); [ -z "$D" ] && log "FP ok: no video repeated while paging 8 videos" || log "FP WRONG: repeated video: $D" ; }
          FPE
          bash -n qa/fx-fp.sh && echo fx-fp.sh syntax ok
          cat > qa/fx-vc.sh <<'VCE'
          vd() { timeout 30 adb shell uiautomator dump /sdcard/vc.xml >/dev/null 2>&1; timeout 20 adb shell cat /sdcard/vc.xml 2>/dev/null | tr '>' '\n' > "$OUT/vc-$1.txt"; }
          vpos() { grep -E "(text|content-desc)=\"$2\"" "$OUT/vc-$1.txt" | sed -n 's/.*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p' | tail -1 | awk '{print int(($1+$3)/2), int(($2+$4)/2)}'; }
          vtap() { vd t; P=$(vpos t "$1"); if [ -z "$P" ]; then log "VC MISSING: '$1' not on screen"; return 1; fi; set -- $P; adb shell input tap $1 $2; sleep 2; log "VC tapped at $1 $2"; }
          vtexts() { grep -oE ' text="[^"]+"' "$OUT/vc-$1.txt" | head -40 | tr '\n' ' '; }
          restart 5; sleep 4
          vtap "Channels"; sleep 4; vd s0; shot VC-01-channels; grep -qF "Video channels" "$OUT/vc-s0.txt" && log "VC ok: Video channels block is at the top of Channels" || log "VC WRONG: no Video channels block on the Channels top"; log "VC channels texts: $(vtexts s0)"
          if vtap "[0-9]+  See all"; then sleep 3; vd s1; shot VC-02-videos-list; log "VC list texts: $(vtexts s1)"
            if grep -qF 'Expert News Status' "$OUT/vc-s1.txt"; then log "VC ok: video channel rows are on screen"; else log "VC WRONG: no video channel rows after tapping Videos"; fi
            grep -qE 'text="[0-9]+ video channels' "$OUT/vc-s1.txt" && log "VC ok: count line shown" || log "VC MISSING: count line"
            log "VC focus: $(tr '>' '\n' < $OUT/vc-s1.txt | grep 'focused="true"' | grep -v FrameLayout | head -2 | cut -c1-200 | tr '\n' ' ')"
            key 20; sleep 1; shot VC-02b-first-key
            if vtap "Expert News Status"; then sleep 3; vd s2; shot VC-03-creator; log "VC creator texts: $(vtexts s2)"
              grep -qE 'text="[0-9]+ videos"' "$OUT/vc-s2.txt" && log "VC ok: creator page lists videos" || log "VC WRONG: creator page shows no video count"
              key 20; sleep 1; shot VC-03b-creator-key
              adb shell settings put system accelerometer_rotation 0; adb shell settings put system user_rotation 1; sleep 3; vd sl; shot VC-03L-creator-landscape; log "VC landscape creator texts: $(vtexts sl)"
              adb shell settings put system user_rotation 0; sleep 3
              key 4; sleep 2; vd s3; shot VC-04-back; if grep -qE 'video channels|Videos' "$OUT/vc-s3.txt"; then log "VC ok: Back returns to the video channel list"; else log "VC WRONG: Back did not return to the list"; fi
            fi
          fi
          VCE
          bash -n qa/fx-vc.sh && echo fx-vc.sh syntax ok
          bash -n qa/fx-entry2.sh && echo fx-entry2.sh syntax ok
      - name: Exact-identity selector for duplicate voice labels in qa/fx-cs.sh (workspace only; asserts each replacement matches once)
        run: |
          python3 - <<'PY'
          import re
          s = open('qa/fx-cs.sh').read()
          def rep(a, b):
              global s
              assert s.count(a) == 1, a[:60]
              s = s.replace(a, b)
          rep('csplayat() {\n  local b tries=0\n', 'csplayat1() {\n  local b tries=0\n')
          rep('b=$(python3 - "$OUT/csplayat.xml" "$1" <<\'PYEOF\'', 'b=$(python3 - "$OUT/csplayat.xml" "$1" "${2:-0}" <<\'PYEOF\'')
          rep('if len(labels) != 1:\n    print("ERR labels=%d" % len(labels)); sys.exit(0)\nlb = bounds(labels[0])', 'labels.sort(key=lambda n: bounds(n)[1] if bounds(n) else 0)\nidx = int(sys.argv[3])\nif idx >= len(labels):\n    print("ERR labels=%d idx=%d" % (len(labels), idx)); sys.exit(0)\nlb = bounds(labels[idx])')
          wrap = 'csplayat() { timeout 30 adb shell uiautomator dump /sdcard/pn.xml >/dev/null 2>&1; local n i=0; n=$(timeout 20 adb shell cat /sdcard/pn.xml 2>/dev/null | tr \'>\' \'\\n\' | grep -cF "text=\\"$1\\""); [ "$n" -lt 1 ] && n=1; while [ $i -lt $n ]; do [ $n -gt 1 ] && log "csplayat: $n bubbles carry the label \'$1\' (distinct messages); playing each in turn, bubble $((i+1)) of $n by position"; csplayat1 "$1" $i; i=$((i+1)); done; }\n'
          rep('csfindexact() {', wrap + 'csfindexact() {')
          open('qa/fx-cs.sh', 'w').write(s)
          
          PY
          bash -n qa/fx-cs.sh && echo fx-cs.sh patched syntax ok && grep -c csplayat1 qa/fx-cs.sh
      - name: Plain variant keeps the unmodified qa/fx-cl.sh
        if: matrix.diag != 'yes'
        run: cmp qa/fx-cl.sh qa/fx-cl.sh && git log -1 --format='plain fx-cl.sh at %h' && sha256sum qa/fx-cl.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator test (Android 11, 480x640, D-pad)
        timeout-minutes: 60
        env:
          QA_FX: ${{ matrix.fx }}
          CL_JOIN_WAIT: ${{ matrix.wait }}
          CL_JOIN_MODE: ${{ matrix.mode }}
          CL_ANIM: ${{ matrix.anim }}
          CL_FIX: ${{ matrix.fix }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_4
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: adb wait-for-device && adb shell settings put global hidden_api_policy 1 && bash qa/native.sh dist/YIDPLUS.apk
      - name: Publish QA evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -d qa/out || exit 0
          cd qa/out && git init -q && git checkout -q -b qa-diag-${{ matrix.target }}-${{ matrix.part }} && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "diag QA run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" qa-diag-${{ matrix.target }}-${{ matrix.part }}
