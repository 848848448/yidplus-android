name: QA diagnostic (IME state, separate from the native workflow)

# Runs the signed-in fixture scripts for a chosen sequence on a fresh emulator, with qa/fx-cl.sh replaced by diag/fx-cl.sh
# (the same script plus IME/focus logging). Triggers only on diag/** and this file, so it never starts or cancels the
# native workflow; it has its own concurrency group and publishes only qa-diag-* log branches.
on:
  push:
    branches: ['feat-*']
    paths: ['diag/**', '.github/workflows/qa-diag.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: qa-diag-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Apply the diagnostic logging patch (workspace only, never committed; QA logging, no behaviour change)
        run: git apply --check diag/app-diag3.patch && git apply diag/app-diag3.patch && git diff --stat
      - name: Signing key (from repository secrets only)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
      - name: Build signed release
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.p12
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -o pipefail
          gradle :app:assembleRelease -PversionName=2.0.0 --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Check
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          ls -la "$APK"
          mkdir -p dist && cp "$APK" dist/YIDPLUS.apk
          unzip -l "$APK" | grep -E "baseline.prof|classes" || true
      - uses: actions/upload-artifact@v4
        with:
          name: diag-apk
          path: dist/
      - name: Resolved Compose versions (from this build's runtime classpath)
        if: always()
        run: |
          mkdir -p /tmp/log
          gradle :app:dependencies --configuration releaseRuntimeClasspath --no-daemon -q 2>&1 | grep -E "androidx\.compose\.(ui|foundation|material3|runtime)[a-z-]*:|compose-bom|androidx\.activity:activity-compose|coil" | sed 's/^[ |+\\-]*//' | sort -u > /tmp/log/compose-versions.txt || true
          cat /tmp/log/compose-versions.txt
      - name: Publish build log
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/log; (grep -E "^e: |error:|FAILED|BUILD|What went wrong" -A3 build.log | head -300 > /tmp/log/errors.txt || true)
          tail -400 build.log > /tmp/log/build-tail.txt 2>/dev/null || true
          ls -la dist/ > /tmp/log/dist.txt 2>/dev/null || true
          cd /tmp/log && git init -q && git checkout -q -b ci-log-diag-${{ github.ref_name }} && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "native build log ${{ github.run_id }} ${{ job.status }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-log-diag-${{ github.ref_name }}

  qa:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: default, part: an8a, wait: '2', mode: 'ctrl', anim: 'off', diag: 'yes', fx: 'qa/fx-ad.sh qa/fx-ch.sh qa/fx-cl.sh' }
          - { target: default, part: an8b, wait: '2', mode: 'ctrl', anim: 'off', diag: 'yes', fx: 'qa/fx-ad.sh qa/fx-ch.sh qa/fx-cl.sh' }
          - { target: default, part: an8c, wait: '2', mode: 'ctrl', anim: 'off', diag: 'yes', fx: 'qa/fx-ad.sh qa/fx-ch.sh qa/fx-cl.sh' }
          - { target: default, part: an8d, wait: '2', mode: 'ctrl', anim: 'on', diag: 'yes', fx: 'qa/fx-ad.sh qa/fx-ch.sh qa/fx-cl.sh' }
          - { target: default, part: an8e, wait: '2', mode: 'ctrl', anim: 'on', diag: 'yes', fx: 'qa/fx-ad.sh qa/fx-ch.sh qa/fx-cl.sh' }
          - { target: default, part: an8f, wait: '2', mode: 'ctrl', anim: 'on', diag: 'yes', fx: 'qa/fx-ad.sh qa/fx-ch.sh qa/fx-cl.sh' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: diag-apk
          path: dist/
      - name: Use the diagnostic copy of fx-cl.sh when the variant asks (workspace only, not committed)
        if: matrix.diag == 'yes'
        run: cp diag/fx-cl7.sh qa/fx-cl.sh
      - name: Plain variant keeps the unmodified qa/fx-cl.sh
        if: matrix.diag != 'yes'
        run: cmp qa/fx-cl.sh qa/fx-cl.sh && git log -1 --format='plain fx-cl.sh at %h' && sha256sum qa/fx-cl.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator test (Android 11, 480x640, D-pad)
        timeout-minutes: 60
        env:
          QA_FX: ${{ matrix.fx }}
          CL_JOIN_WAIT: ${{ matrix.wait }}
          CL_JOIN_MODE: ${{ matrix.mode }}
          CL_ANIM: ${{ matrix.anim }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_4
          ram-size: 3072M
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash qa/native.sh dist/YIDPLUS.apk
      - name: Publish QA evidence
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -d qa/out || exit 0
          cd qa/out && git init -q && git checkout -q -b qa-diag-${{ matrix.target }}-${{ matrix.part }} && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "diag QA run ${{ github.run_id }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" qa-diag-${{ matrix.target }}-${{ matrix.part }}
